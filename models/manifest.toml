# ── 热词那条路，先摘掉 ─────────────────────────────────────────
# 这里原来有一条 seaco_paraformer（SeACo-Paraformer，带热词/上下文偏置）。
# 摘掉的理由：**我们核不实它到底是哪个包**。原来填的 URL 指向 paraformer-zh-small
# （78 MB），而记的体积是 953 MB —— 两边对不上；官方文档里也没有任何一个 release
# 自称 SeACo。sha256 又是空的，校验这一关等于没有。
# 一个明知道指错的下载地址留在公开清单里，比没有更糟：拉下来是另一个模型，还不报错。
#
# 但那个**发现**是真的，记在这儿别丢：热词是目前唯一已知能把「正确候选造出来」的手段。
# 术语库只能把音近的残缺候选锚回正确词形 —— 前提是至少有一路已经给出了音近的东西；
# 热词不一样，它能让引擎在解码时就倾向那个词。代价是额外约 3.1 GB 内存。
# 要接这条路，先把包核准（确认带 SeACo 热词分支）、补 sha256，再加回来。
