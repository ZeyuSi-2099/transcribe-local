# 模型清单
#
# ⛔ 本仓库不重分发任何模型权重。下载器只按下面的地址从各自官方源拉，并校验 SHA256。
#
# license：默认四路 + 声纹 + VAD 共 7 个已逐个查清（2026-09-11），来源记在 license_src 里。
#    这些权重的许可跟本仓库的 BSL 是两回事，用户要遵守的是模型方那一份。
#    已知反例：Reverb-v2 明确禁止商用（我们测过并否决了），说明这类条款真实存在。
#    ⚠️ 上游可能改许可。换模型、升版本时重新查，别沿用这里的结论。
#
# sha256：已按下面的办法填好 —— 没有下 2.8 G 重来一遍，而是拿本机缓存的同名包，
#    先用 HEAD 比对源文件的精确字节数，再用 Range 抽查头/中/尾各 1 MB 与源逐字节比对，
#    三段加精确大小都一致后才对本地文件算哈希。对「防下载损坏」这个用途足够；
#    它不是供应链签名，真实性由 HTTPS + GitHub Release 保证。

# size_mb = **下载体积**（压缩包字节数，实测自源站），不是解压后占盘大小。
# 首启向导报的「合计要下多少」用的就是它，所以这里必须是下载体积。
schema = 1

