[project]
name = "transcribe-local"
version = "0.1.0.dev0"
description = "四台本地开源 ASR 转同一段录音，分歧交给大模型定字"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Transcribe Labs" }]
dependencies = [
    "sherpa-onnx>=1.10",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
docx = ["python-docx>=1.1"]
server = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
transcribe-local = "transcribe_local.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcribe_local"]

[tool.ruff]
line-length = 110
target-version = "py310"
