[project]
name = "transcribe-local"
version = "0.1.0.dev0"
description = "四台本地开源 ASR 转同一段录音，分歧交给大模型定字"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Transcribe Labs" }]
dependencies = [
    "sherpa-onnx>=1.10",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
docx = ["python-docx>=1.1"]
# 界面用标准库起服务，不需要 FastAPI / uvicorn —— 「一行 pip install、四个依赖」这句话值得守住

[project.scripts]
transcribe-local = "transcribe_local.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcribe_local"]

# 这四样必须进包，否则 pip 装完找不到：paths.root() 靠 config.default.yaml 当路标向上找项目根，
# 源码树里它在仓库根、装成 wheel 之后就得在包目录里 —— 两种情形都要能找到。
[tool.hatch.build.targets.wheel.force-include]
"config.default.yaml" = "transcribe_local/config.default.yaml"
"models/manifest.toml" = "transcribe_local/models/manifest.toml"
"web" = "transcribe_local/web"

[tool.ruff]
line-length = 110
target-version = "py310"
