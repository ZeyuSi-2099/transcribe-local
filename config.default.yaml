# Transcribe Local · 默认配置
#
# 每个参数后面的方括号是「这个默认值从哪来的」：
#
#   [定档]     有全长实测支撑，改之前先看 why 里的理由
#   [未验证]   照搬上游或凭常识定的，没有实测证据
#   [有更好的] 已经量出更好的做法，但还没落地
#   [缺陷]     已知有问题，尚未修
#
# 界面里的每个参数都会显示这个标记和 why。命令行用 `transcribe-local config --explain <键>` 查。

profile: zh                      # 语言 profile，见 profiles/<lang>.yaml

# ─────────────────────────────────────────────────────────────
# ① 音频与切块
# ─────────────────────────────────────────────────────────────
audio:
  sample_rate: 16000             # [定档] 所有模型都要 16 kHz 单声道
  channels: 1                    # [定档]

diarize:
  segmentation: pyannote-segmentation-3.0   # [定档] 工序①
  embedding: campplus-zh                    # [定档] 全长人工核听 4:2 胜 ERes2Net-200k，且快 2.3 倍、小 8 倍
  num_clusters: 2                           # [定档] 写死 2。多给名额不会去找第三人，会去劈主说话人；
                                            #        自动阈值的可用窗口只有 1.15–1.25，越界静默全塌
  min_duration_on: 0.05                     # [定档] 出厂默认 0.15 会把不到半秒的「嗯/哦」全抹掉；
  min_duration_off: 0.10                    # [定档] 放开到 0.05/0.10 后召回 +8、精确 +4
                                            # ⚠️ 引擎横评那 192 块是用旧值 0.15/0.20 切的，
                                            #    复现横评成绩时要用旧值，见 docs/reproduce.md
  role_assign: talk_time                    # [未验证] 谁是主持人（M）、谁是受访者（R）。
                                            #   talk_time = 总说话时长短的那位判为主持人（访谈里提问方说得少）
                                            #   none      = 不判，直接输出 SPK0 / SPK1，你自己改
                                            # 云端生产线这一步是用一个小模型判的；本地版先用这条启发式，
                                            # 它在我们那条测试录音上是对的，但没有在别的录音上验过。

vad:
  enabled: true                  # [定档] 不是可选项。声纹分段单用会漏 215 个真字，
                                 #        加上 VAD 取并集后只漏 4 个
  model: silero_vad              # [定档]
  min_silence_duration: 0.35     # [未验证]
  min_speech_duration: 0.15      # [未验证]
  max_speech_duration: 20.0      # [未验证]

chop:
  max_length: 18.0               # [定档] 全片切成 192 块
                                 # ⚠️ 这个值是为 Paraformer 调的，对另外三路不一定最优 ——
                                 #    目前最大的未控变量。而且边界位置真的会动结果（见下 strategy）。
  pad: 0.15                      # [未验证] 每块前后各留的余量
  strategy: even                 # [有更好的] 现在是等分切。实测「在 ±2 秒窗口里找最安静的一刻」
                                 #            能把刀口处的音量从 0.0144 降到 0.0015（1/10），
                                 #            代价是块长上限从 18 秒放宽到 20 秒。
                                 #            代码已在（设 quietest 即可），但**默认不开**：
                                 # ⚠️ 块边界对识别结果极其敏感。实测把同一条录音的块边界只挪 0.0005 秒
                                 #    （8 个采样点），Zipformer-CTC 有 16/184 块、Paraformer 有 32/191 块
                                 #    文字就变了 —— 而这两台是确定性引擎（同一份块跑两遍逐字相同）。
                                 #    quietest 会把刀口挪最多 2 秒，等于大面积改写输出。
                                 #    **开它之前必须重新打分，不能假设是纯改进。**
                                 #            可选值：even | quietest

# ─────────────────────────────────────────────────────────────
# ② Phase 1 · 多路 ASR
# ─────────────────────────────────────────────────────────────
engines:
  # [定档] 这四台不是成绩最好的四台，是解码路线互不相同的四台。
  #        两两坏块重合度 32.6%–45.8%，没有一对超过 46%。
  #        全长口径（461 个实质语义块里出问题的块数）：
  #          FireRed 56 · Zipformer-CTC 58 · Paraformer 63 · Qwen3-ASR 67
  #        组合天花板：1台 56 → 2台 28 → 3台 22 → 4台 19 → 5台 19（第五台零增益）
  enabled:
    - firered_asr2               # AED 自回归 · 1.2 G · 649 s
    - zipformer_ctc              # CTC 逐帧 · 351 M · 68 s
    - paraformer_2023            # 非自回归 · 234 M · 54 s
    - qwen3_asr                  # LLM 式 · 954 M · 360 s

  num_threads: 2                 # [未验证] 每台引擎的推理线程数
  parallel: auto                 # [未验证] 同时跑几台引擎。auto = 按这台机器算，取三者最小：
                                 #     ① 引擎台数
                                 #     ② (核数 - 1) ÷ num_threads    留一个核给系统
                                 #     ③ (总内存 - 4 G) ÷ 最重那台    见 engines.PEAK_MB
                                 #   填数字 = 你说了算；超过安全值会警告但照跑。1 = 逐台跑。
                                 #   ⚠️ 分母按总内存算、不按「当前可用」算 —— 否则同一台机器
                                 #     今天跑三台明天跑一台，两次成绩不可比。当前可用只用来开跑前示警。

  # [定档] AED / LLM 式引擎（firered_asr2 / qwen3_asr）会抽风，必须配熔断器：
  #        实测 FireRed 在 34:34 把「嗯」连吐 99 次，吞掉三个语义块；
  #        Qwen3-ASR 对 17 秒真人说话吐出空白。CTC 系逐帧对齐，跑十次同一份稿子，不检测。
  # 检测（搬自生产线 Gemini 适配器）：**字符法 + 词法两道都跑**，1–6 字短串或 1–3 词短语
  #   连续重复 ≥ 阈值即判。只有字符法时「词+空格」长于 6 字符的复读整个漏掉（生产线 2026-08-26 事故）。
  # 重试 = 一张三档的梯子（engines.LADDER），**原样重跑没用**：离线解码是贪心的，同一段音频
  #   逐字相同（34:34 那一块连跑三遍，输出长度都是 122）。三档：起止各外扩 50 ms → 各外扩 150 ms
  #   → 在中点附近最安静处切半各解一次。一律往外扩、不往里切（往里切会丢音频）。
  # ⚠️ 梯子走完仍不行 → **这一路这一块弃用**（Duner 2026-09-11 定）：文本置空，分歧册显示 ∅、
  #   融合材料里不带这一路；原文与每次尝试都记在 work/qc_warnings.json。不是丢内容 ——
  #   另外几路对同一块有自己的版本；把复读的毒当正文喂给融合才是害（它曾原样当过顶格主行）。
  circuit_breaker:
    repeat_detect: true          # [定档] 复读检测（字符法 + 词法）
    repeat_threshold: 10         # [定档] 生产线在 113 份产物上定的线；9 次不判、10 次判
    empty_block_retry: true      # [定档] 该路吐空而块长 ≥2 秒 → 走同一张梯子
    max_retry: 3                 # [定档] 梯子三档全走完。调小只是少走几档；不能调大 —— 梯子就三档

# 候选池（不在 enabled 里，但适配器已接，可以自己换上来试）
# [定档·已否决] whisper_large_v3(123) · zipformer_transducer(130) · dolphin_ctc(137)
#               whisper_turbo(161) · firered_ctc(93) · telespeech(踩内容红线，30% 没出来)
# [定档·同源冗余] seaco_paraformer(63) · paraformer_large(65) —— 与 paraformer_2023 坏块重合 86–91%，
#                 加进来天花板一点不动。seaco 唯一的价值是它支持热词 ——
#                 但那个包我们没核实成，已从 models/manifest.toml 摘掉，原委记在那里。

# ─────────────────────────────────────────────────────────────
# ③ 术语库
# ─────────────────────────────────────────────────────────────
terms:
  files: []                      # 手写的术语库路径，可多个。默认空 = 不注入
                                 # 格式：一行一条 `- 术语 ｜ 含义`，只收正确写法、不枚举错写形
  inject_p3: true                # [定档] 注入 Phase 3 作硬证据。零额外成本
  inject_p1_hotwords: false      # [未验证] SeACo 的热词分支，把词直接送进解码。
                                 #          3 分钟片段实测把一个音近的错写锚回了库里的正确词形 ——
                                 #          这是唯一已知能把正确候选「造出来」的手段。
                                 #          代价：额外 3.1 GB 内存，且要挂一台支持热词的引擎当第五路
                                 #          （那个包尚未核实，现在清单里没有，见 models/manifest.toml）

# ─────────────────────────────────────────────────────────────
# ④ 分歧册
# ─────────────────────────────────────────────────────────────
divergence:
  fold_fillers: true             # [定档] 语气词与口吃造成的差异自动折叠，实测折掉 39% 的噪声
  fillers: "嗯呃啊哦额诶欸唉哎呀吧嘛呢啦哈唔哟喔噢"   # [定档] 19 字。
                                 # ⚠️ 判据里的「附和词表」是 23 字（多「对 是 好 行」），**两张表故意不同，不要合并**。
                                 #   它们回答的是两个不同的问题：
                                 #     附和表 ——「整块是不是纯应答」。只由这些字组成的整块不计分，
                                 #                所以「对 是 好 行」属于它。
                                 #     语气词表 ——「块内这处差异有没有意思」。这四个字在块内是承载意义的词。
                                 #   实测：把两张表合成 23 字，实质分歧 542 → 526，**16 处真差异会被当成语气词折掉**
                                 #   （含「就是」↔「就」三处、以及一处「运行」被截成「运」）。
                                 #   而上游对照实验的结论是「全量点名有益、做减法有害」。
  strip_tags: true               # [定档] 剥掉 <sil> 之类的模型标记。
                                 # 原脚本只清洗了候选、没清正文那一行，于是 <sil> 会漏进终稿
                                 #（全长实测 5 处）。这里正文和候选都清，同一份输入实测 0 处。

# ─────────────────────────────────────────────────────────────
# ⑤ Phase 3 · 融合定字
# ─────────────────────────────────────────────────────────────
p3:
  # 只认一个协议：OpenAI 的 /v1/chat/completions。
  # 云端 API 和本机模型说的是同一个协议，所以换后端只改下面三行、代码一条路径。
  #
  # ── 两条路，都支持 ────────────────────────────────────────────
  # ① 接一个 API（默认，推荐）。便宜、效果稳、不占内存、不用下几个 G 的权重。
  #    ⚠️ 走这条路时，**这一步会把转录文本发给你选的那家**（音频不会）。
  #       介意就走 ②，那条是全程离线的。
  # ② 用本机大模型。全程不联网，一个字节都不出这台机器；代价是要下权重、吃内存、慢。
  #    改成：base_url: http://127.0.0.1:11434/v1 · model: qwen3:8b（Ollama）
  #          或 http://127.0.0.1:11435/v1（mlx_lm.server / LM Studio / llama-server）
  # ─────────────────────────────────────────────────────────────
  base_url: https://api.deepseek.com/v1
  model: deepseek-flash                    # [定档] 我们自己的云端生产线落到 DeepSeek 时，用的就是这一档。
                                           #   deepseek-v4-flash 是同一个名字的别名，服务端解析成 deepseek-flash。
                                           #   还有更贵的 deepseek-v4-pro，别默认选它 —— 2026-08 我们逐处人工核听，
                                           #   14 处真差异它错了 13 处：毛病是该拍板的时候不拍板、照抄主引擎，
                                           #   钱大半花在「想」上，想完反而更保守。机器指标上两档打平。
                                           # 界面「设置」页可以直接切，不用手改这个文件
  api_key_env: DEEPSEEK_API_KEY            # 只从环境变量读。⛔ 永不写进配置文件、永不进日志
                                           #    换别家就改这三行，例如 OpenAI：
                                           #    base_url: https://api.openai.com/v1 + 对应的 key 变量名

  prompt: ""                     # [定档] 留空 = 用内置的那份融合提示词（在包里，不是单独文件）。
                                 #    内置那份由我们生产线的提示词同步生成：判断规则
                                 #   （融合原则 / 混读速查 / 出稿前复查 / 润色）与生产版**逐字相同**，
                                 #    72% 字符原封不动；只有四处不同，且都是「本地根本没有那个东西」：
                                 #      没有主轨 · 说话人来自共用声纹分段 · 不联网 · 不写文件不出报告。
                                 #
                                 # 想用自己写的？填一个路径进来就行，它会覆盖内置那份 ——
                                 # 但**跑的时候会提醒你成绩不再与我们发布的数字可比**。
                                 # 提示词是这条链上最敏感的一个旋钮：措辞一改，成绩就是另一回事，
                                 # 而 P3 的 run-to-run 方差本来就大，单跑一次分不清是改好了还是运气。
                                 # ⚠️ 提示词里写了「每块都必须有文字」，代码里还有一道兜底：
                                 #    某块被写成只有 [❓]、一个字都没有时，自动按各路票数最多的
                                 #    原文填回去、标 [❓]、打印警告（fuse.py::_revive）。
                                 #    实测简化版提示词全长跑出过 1 处这种空块（07:15）。
                                 #    提示词是请求、代码才是保证 —— 内容不能丢是红线。
  temperature: 0.0               # [定档]
  blocks_per_call: 8             # [有更好的] 每次喂几块。现在是硬切，
                                 #            跨块的「临近句复述」证据会在批次边界被切断。
                                 #            应该加重叠窗，未落地。
  overlap: 0                     # [有更好的] 批次之间重叠几块。0 = 不重叠
  timeout: 1200                  # [定档] 单次调用超时（秒）。照抄生产线 ——
                                 #        开着推理的模型一批十几分钟很正常，600 秒会误杀
  max_retry: 2                   # [未验证]
  max_tokens: 64000              # [定档] 照抄生产线。**被它砍断 = 这一批后半截没生成**，
                                 #        代码会报错退出、绝不落残缺稿（fuse.py 里那道截断护栏）。
                                 #        静默收下半截等于悄悄丢内容，踩「内容不能丢」。

  extra:                         # 原样并进请求体的额外字段。留给各家后端的专属参数，
                                 # 这样 fuse.py 本身不用认任何一家厂商。
    reasoning_effort: high       # [定档] DeepSeek 专属，照抄我们云端生产线的档位。
                                 # ⚠️ 换别家后端记得删掉这一行 —— 不认识它的后端会报 400。
                                 # 生产线注释原话：「实测生产档 high；max 无质量增益且更易抽风」。
                                 # 代价是慢：开着推理，一批十几分钟很正常，所以上面 timeout 给到 1200。
                                 #
                                 # ⚠️ 别把这条经验套到本地小模型上，两者相反：
                                 #   DeepSeek 这一档**要开推理**；而 Qwen3 系本地模型**要关思考** ——
                                 #   实测 4B 开思考比不开改得更多、错得更反（参数量才是杠杆，思考不是）。
                                 #   本地关法随后端而异，例如：
                                 #     extra: {chat_template_kwargs: {enable_thinking: false}}   # vLLM / 部分网关
                                 #   mlx_lm.server 则是启动时加 --chat-template-args '{"enable_thinking": false}'

  # 选模型参考。5 分钟窗口、59 个实质块，最好单台 10 处待判、天花板 4 处：
  #   Qwen3-4B          待判 12 · 拿回 −33% · 照抄率 84% · 240 s（本机）
  #   Qwen3-8B          待判  9 · 拿回 +17% · 照抄率 88% · 430 s（本机）
  #   Claude Opus 5     待判  5 · 拿回 +83% · 照抄率 58% · 135 s（API）
  # 这就是为什么默认走 API：本机 8B 那一档，**拿回的比拿不回的还少**，
  # 而一次 API 调用的钱远不如你复核那些错字的时间值钱。
  # 全程离线是我们认真支持的第二条路，但它是**为「数据一个字节都不许出机器」准备的**，
  # 不是省钱方案 —— 别把它当默认最优。
  # 差距在**跨句证据**上：8B 的 6 处改动里 5 处正确，但全是块内多数票，它错的恰好是要看下一块
  # 复述才能定的那几处。参数量是杠杆，**思考模式不是**（4B 开思考改得更多、错得更反）。
  #
  # ⚠️ Qwen3-14B-4bit 在 16 GB 机器上**不可用** —— 不是慢，是换页：模型 8.3 G，加载后系统
  #   可用内存掉到 12%、8 G swap 用掉 6.8 G、页面换出 320 万次，一批 8 块十几分钟出不来。
  #   **16 GB 的上限是 8B。** 要跑更大的模型，按经验留「模型体积 × 2」的内存。

# ─────────────────────────────────────────────────────────────
# ⑥ 输出
# ─────────────────────────────────────────────────────────────
export:
  formats: [md, docx]            # md | docx | srt | txt
  footer_credit: true            # 文末一行生成者标记。不盖在内容上、不加 logo、不进页眉
  keep_uncertain_marks: true     # [定档] 保留 [❓]。这是复核入口，不要为了「好看」去掉
