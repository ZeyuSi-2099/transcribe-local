# Transcribe Local · 默认配置
#
# 每个参数后面的方括号是「这个默认值从哪来的」：
#
#   [定档]     有全长实测支撑，改之前先看 why 里的理由
#   [未验证]   照搬上游或凭常识定的，没有实测证据
#   [有更好的] 已经量出更好的做法，但还没落地
#   [缺陷]     已知有问题，尚未修
#
# 界面里的每个参数都会显示这个标记和 why。命令行用 `transcribe-local config --explain <键>` 查。

profile: zh                      # 语言 profile，见 profiles/<lang>.yaml

# ─────────────────────────────────────────────────────────────
# ① 音频与切块
# ─────────────────────────────────────────────────────────────
audio:
  sample_rate: 16000             # [定档] 所有模型都要 16 kHz 单声道
  channels: 1                    # [定档]

diarize:
  segmentation: pyannote-segmentation-3.0   # [定档] 工序①
  embedding: campplus-zh                    # [定档] 全长人工核听 4:2 胜 ERes2Net-200k，且快 2.3 倍、小 8 倍
  num_clusters: 2                           # [定档] 写死 2。多给名额不会去找第三人，会去劈主说话人；
                                            #        自动阈值的可用窗口只有 1.15–1.25，越界静默全塌
  min_duration_on: 0.05                     # [定档] 出厂默认 0.15 会把不到半秒的「嗯/哦」全抹掉；
  min_duration_off: 0.10                    # [定档] 放开到 0.05/0.10 后召回 +8、精确 +4
                                            # ⚠️ 引擎横评那 192 块是用旧值 0.15/0.20 切的，
                                            #    复现横评成绩时要用旧值，见 docs/reproduce.md
  role_assign: talk_time                    # [未验证] 谁是主持人（M）、谁是受访者（R）。
                                            #   talk_time = 总说话时长短的那位判为主持人（访谈里提问方说得少）
                                            #   none      = 不判，直接输出 SPK0 / SPK1，你自己改
                                            # 云端生产线这一步是用一个小模型判的；本地版先用这条启发式，
                                            # 它在我们那条测试录音上是对的，但没有在别的录音上验过。

vad:
  enabled: true                  # [定档] 不是可选项。声纹分段单用会漏 215 个真字，
                                 #        加上 VAD 取并集后只漏 4 个
  model: silero_vad              # [定档]
  min_silence_duration: 0.35     # [未验证]
  min_speech_duration: 0.15      # [未验证]
  max_speech_duration: 20.0      # [未验证]

chop:
  max_length: 18.0               # [定档] 全片切成 192 块
                                 # ⚠️ 这个值是为 Paraformer 调的，对另外三路不一定最优 ——
                                 #    目前最大的未控变量。而且边界位置真的会动结果（见下 strategy）。
  pad: 0.15                      # [未验证] 每块前后各留的余量
  strategy: even                 # [有更好的] 现在是等分切。实测「在 ±2 秒窗口里找最安静的一刻」
                                 #            能把刀口处的音量从 0.0144 降到 0.0015（1/10），
                                 #            代价是块长上限从 18 秒放宽到 20 秒。
                                 #            代码已在（设 quietest 即可），但**默认不开**：
                                 # ⚠️ 块边界对识别结果极其敏感。实测把同一条录音的块边界只挪 0.0005 秒
                                 #    （8 个采样点），Zipformer-CTC 有 16/184 块、Paraformer 有 32/191 块
                                 #    文字就变了 —— 而这两台是确定性引擎（同一份块跑两遍逐字相同）。
                                 #    quietest 会把刀口挪最多 2 秒，等于大面积改写输出。
                                 #    **开它之前必须重新打分，不能假设是纯改进。**
                                 #            可选值：even | quietest

# ─────────────────────────────────────────────────────────────
# ② Phase 1 · 多路 ASR
# ─────────────────────────────────────────────────────────────
engines:
  # [定档] 这四台不是成绩最好的四台，是解码路线互不相同的四台。
  #        两两坏块重合度 32.6%–45.8%，没有一对超过 46%。
  #        全长口径（461 个实质语义块里出问题的块数）：
  #          FireRed 56 · Zipformer-CTC 58 · Paraformer 63 · Qwen3-ASR 67
  #        组合天花板：1台 56 → 2台 28 → 3台 22 → 4台 19 → 5台 19（第五台零增益）
  enabled:
    - firered_asr2               # AED 自回归 · 1.2 G · 649 s
    - zipformer_ctc              # CTC 逐帧 · 351 M · 68 s
    - paraformer_2023            # 非自回归 · 234 M · 54 s
    - qwen3_asr                  # LLM 式 · 954 M · 360 s

  num_threads: 2                 # [未验证] 每台引擎的推理线程数
  parallel: 1                    # [未验证] 同时跑几台。1 = 逐台跑（峰值内存 2.7 G）；
                                 #          调大更快但内存叠加，16 G 机器慎用

  # [定档] AED 系（firered_asr2 / qwen3_asr）会抽风，必须配熔断器：
  #        实测 FireRed 在 34:34 把「嗯」连吐 30+ 次，吞掉内容；
  #        Qwen3-ASR 对 17 秒真人说话吐出空白（全长 192 块里有 6 块）。
  #        CTC 系（zipformer_ctc / paraformer_2023）逐帧对齐，跑十次同一份稿子，不检测。
  # ⚠️ 重试用尽后**不改写、不丢弃**坏块 —— 改写等于把问题藏起来，而另外三路对同一块有
  #    自己的版本，融合那一步本来就能救回来。但会逐块打印警告 + 落 work/qc_warnings.json。
  #    实测：34:34 那一块三次解码全部复读，「重跑就好了」在那里不成立。
  circuit_breaker:
    repeat_detect: true          # [定档] 单块内同一字符连续重复超阈值 → 该块重跑
    repeat_threshold: 10         # [未验证] 阈值本身没调过
    empty_block_retry: true      # [定档] 该路吐空而块长 ≥2 秒 → 该块重跑
    max_retry: 2                 # [未验证] 重试次数没调过

# 候选池（不在 enabled 里，但适配器已接，可以自己换上来试）
# [定档·已否决] whisper_large_v3(123) · zipformer_transducer(130) · dolphin_ctc(137)
#               whisper_turbo(161) · firered_ctc(93) · telespeech(踩内容红线，30% 没出来)
# [定档·同源冗余] seaco_paraformer(63) · paraformer_large(65) —— 与 paraformer_2023 坏块重合 86–91%，
#                 加进来天花板一点不动。留 seaco 的唯一理由是它支持热词。

# ─────────────────────────────────────────────────────────────
# ③ 术语库
# ─────────────────────────────────────────────────────────────
terms:
  files: []                      # 手写的术语库路径，可多个。默认空 = 不注入
                                 # 格式：一行一条 `- 术语 ｜ 含义`，只收正确写法、不枚举错写形
  inject_p3: true                # [定档] 注入 Phase 3 作硬证据。零额外成本
  inject_p1_hotwords: false      # [未验证] SeACo 的热词分支，把词直接送进解码。
                                 #          3 分钟片段实测把「舒成箱」修成了「数采箱」——
                                 #          这是唯一已知能把正确候选「造出来」的手段。
                                 #          代价：额外 3.1 GB 内存，且要把 seaco_paraformer 挂成第五路

# ─────────────────────────────────────────────────────────────
# ④ 分歧册
# ─────────────────────────────────────────────────────────────
divergence:
  fold_fillers: true             # [定档] 语气词与口吃造成的差异自动折叠，实测折掉 39% 的噪声
  fillers: "嗯呃啊哦额诶欸唉哎呀吧嘛呢啦哈唔哟喔噢"   # [定档] 19 字。
                                 # ⚠️ 判据里的「附和词表」是 23 字（多「对 是 好 行」），**两张表故意不同，不要合并**。
                                 #   它们回答的是两个不同的问题：
                                 #     附和表 ——「整块是不是纯应答」。只由这些字组成的整块不计分，
                                 #                所以「对 是 好 行」属于它。
                                 #     语气词表 ——「块内这处差异有没有意思」。这四个字在块内是承载意义的词。
                                 #   实测：把两张表合成 23 字，实质分歧 542 → 526，**16 处真差异会被当成语气词折掉**
                                 #   （含「就是」↔「就」三处、以及一处「运行」被截成「运」）。
                                 #   而上游对照实验的结论是「全量点名有益、做减法有害」。
  strip_tags: true               # [定档] 剥掉 <sil> 之类的模型标记。
                                 # 原脚本只清洗了候选、没清正文那一行，于是 <sil> 会漏进终稿
                                 #（全长实测 5 处）。这里正文和候选都清，同一份输入实测 0 处。

# ─────────────────────────────────────────────────────────────
# ⑤ Phase 3 · 融合定字
# ─────────────────────────────────────────────────────────────
p3:
  # 只认一个协议：OpenAI 的 /v1/chat/completions。
  # 本地的 Ollama / LM Studio / llama-server 说这个协议，DeepSeek / OpenAI 也说这个协议。
  # 换后端只改下面三行。
  base_url: http://127.0.0.1:11434/v1      # 默认本机 Ollama
  model: qwen3:8b
  api_key_env: TRANSCRIBE_LOCAL_API_KEY    # 只从环境变量读。⛔ 永不写进配置文件、永不进日志

  prompt: prompts/merge.zh.md    # [定档] 融合提示词。可以直接改这个文件
  temperature: 0.0               # [定档]
  blocks_per_call: 8             # [有更好的] 每次喂几块。现在是硬切，
                                 #            跨块的「临近句复述」证据会在批次边界被切断。
                                 #            应该加重叠窗，未落地。
  overlap: 0                     # [有更好的] 批次之间重叠几块。0 = 不重叠
  timeout: 600                   # [未验证] 单次调用超时（秒）
  max_retry: 2                   # [未验证]

  extra: {}                      # 原样并进请求体的额外字段。留给各家后端的专属参数，
                                 # 这样 fuse.py 本身不用认任何一家厂商。
                                 # ⚠️ 跑 Qwen3 系本地模型时大概率要关思考模式 ——
                                 #   它默认开，会先生成一大段 <think> 再给答案，慢且没有收益：
                                 #   实测 4B 开思考比不开改得更多、错得更反，**参数量才是杠杆，思考不是**。
                                 #   关法随后端而异，例如：
                                 #     extra: {chat_template_kwargs: {enable_thinking: false}}   # vLLM / 部分网关
                                 #   mlx_lm.server 则是启动时加 --chat-template-args '{"enable_thinking": false}'

  # 参考：同一份 5 分钟输入、59 个实质块，最好单台 10 处待判、天花板 4 处
  #   Qwen3-4B          待判 12 · 拿回 −33% · 照抄率 84%
  #   Qwen3-8B          待判  9 · 拿回 +17% · 照抄率 88%
  #   Claude Opus 5     待判  5 · 拿回 +83% · 照抄率 58%
  # 差距在跨句证据上，参数量是那个杠杆；思考模式不是（4B 开思考改得更多、错得更多）。

# ─────────────────────────────────────────────────────────────
# ⑥ 输出
# ─────────────────────────────────────────────────────────────
export:
  formats: [md, docx]            # md | docx | srt | txt
  footer_credit: true            # 文末一行生成者标记。不盖在内容上、不加 logo、不进页眉
  keep_uncertain_marks: true     # [定档] 保留 [❓]。这是复核入口，不要为了「好看」去掉
